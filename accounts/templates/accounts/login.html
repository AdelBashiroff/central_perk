{% extends 'base.html' %}

{% block title %}Вход - Central Perk{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h2>☕ Вход</h2>
            </div>
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверное имя пользователя или пароль!
                    </div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">
                            Имя пользователя
                        </label>
                        <input type="text" 
                               name="username" 
                               class="form-control" 
                               id="{{ form.username.id_for_label }}"
                               required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">
                            Пароль
                        </label>
                        <input type="password" 
                               name="password" 
                               class="form-control" 
                               id="{{ form.password.id_for_label }}"
                               required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        Войти
                    </button>
                </form>
            </div>
            <div class="card-footer text-center">
                <p class="mb-0">
                    Нет аккаунта? 
                    <a href="{% url 'accounts:register' %}">Зарегистрируйтесь!</a>
                </p>
                <p class="mb-0">
                    <a href="{% url 'account_reset_password' %}">Забыли пароль?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
